name: SenWeave

on: [push, pull_request]

permissions:
  contents: read

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        target: [native, js, wasm-gc]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: hustcer/setup-moonbit@v1
      - run: moon version --all
      - run: moon update
      - run: moon fmt --check
      - run: moon check --target ${{ matrix.target }} --deny-warn
      - run: moon test --target ${{ matrix.target }}
      - run: moon run examples/labels --target ${{ matrix.target }}
      - run: moon run examples/json --target ${{ matrix.target }}
      - run: moon run examples/gateway --target ${{ matrix.target }}
      - run: moon run examples/cbor --target ${{ matrix.target }}
      - run: moon info --target ${{ matrix.target }}
      - run: git diff --exit-code -- '*.mbti'

  cbor-interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: hustcer/setup-moonbit@v1
      - run: moon update
      - run: python -m pip install cbor2==5.7.1
      - run: python scripts/check_cbor_interop.py --target js
      - run: moon build cmd/bridge cmd/coapbridge --target js --release --deny-warn
      - run: python -m pip install kpn-senml==1.0.1
      - run: python scripts/check_senml_interop.py
      - run: python -m pip install aiocoap==0.4.14
      - run: python scripts/check_coap_interop.py
      - run: python scripts/check_coap_interop.py --storage

  cli:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: hustcer/setup-moonbit@v1
      - run: moon update
      - run: moon build cmd/bridge cmd/coapbridge --target js --release --deny-warn
      - run: node --test tests/cli.test.mjs tests/coap.test.mjs
      - run: node examples/coap/retry-demo.mjs

  distribution:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: hustcer/setup-moonbit@v1
      - run: moon update
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: npm run test:sdk
      - run: npm run verify:package
      - run: python scripts/check_moon_package.py
