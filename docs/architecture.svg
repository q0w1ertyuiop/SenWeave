<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="590" viewBox="0 0 1120 590" role="img" aria-labelledby="title desc">
  <title id="title">SenWeave implementation and planned architecture</title>
  <desc id="desc">Implemented: bounded JSON and CBOR parsing, shared typed records, base and time resolution, chronological measurements, filtering and standalone JSON/CBOR output. CBOR codec is reused behind wire preflight. Python cbor2 verifies both directions. Host supplies the clock and transport.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#758397"/></marker></defs>
  <rect width="1120" height="590" rx="20" fill="#f5f8fc"/>
  <g font-family="Segoe UI,Arial,sans-serif">
    <text x="42" y="48" font-size="25" font-weight="700" fill="#102539">SenWeave · SenML data semantics</text>
    <text x="42" y="76" font-size="15" fill="#526278">Solid green = implemented · Dashed outline = planned</text>
    <rect x="42" y="111" width="1036" height="76" rx="12" fill="#e0f6ef" stroke="#14775d" stroke-width="2"/>
    <text x="64" y="142" font-size="18" font-weight="600" fill="#145742">Shared label vocabulary · MoonBit</text>
    <text x="64" y="169" font-size="15" fill="#145742">15 RFC 8428 labels · JSON names ↔ integer CBOR keys · exact lookup</text>
    <g fill="#e0f6ef" stroke="#14775d" stroke-width="2">
      <rect x="42" y="227" width="224" height="136" rx="12"/>
      <rect x="312" y="227" width="224" height="136" rx="12"/>
      <rect x="582" y="227" width="224" height="136" rx="12"/>
      <rect x="852" y="227" width="226" height="136" rx="12"/>
    </g>
    <g fill="#31435b" font-size="17" font-weight="600">
      <text x="60" y="258">JSON / CBOR ingress</text><text x="330" y="258">Typed raw pack</text>
      <text x="600" y="258">Resolve bases + time</text><text x="870" y="258">Independent records</text>
    </g>
    <g fill="#526278" font-size="14">
      <text x="60" y="287">Wire preflight + types</text><text x="60" y="313">Duplicate labels + limits</text><text x="60" y="339">Reused CBOR codec</text>
      <text x="330" y="287">Values + context records</text><text x="330" y="313">Exact source numbers</text><text x="330" y="339">Original order retained</text>
      <text x="600" y="287">Explicit reference clock</text><text x="600" y="313">Finite arithmetic + budget</text><text x="600" y="339">Stable time ordering</text>
      <text x="870" y="287">Filter + source indexes</text><text x="870" y="313">Standalone JSON / CBOR</text><text x="870" y="339">Gateway + cbor2 checks</text>
    </g>
    <g stroke="#758397" stroke-width="2" marker-end="url(#arrow)"><path d="M268 295h32"/><path d="M538 295h32"/><path d="M808 295h32"/></g>
    <rect x="42" y="398" width="1036" height="64" rx="12" fill="#e9eef5"/>
    <text x="64" y="424" font-size="15" font-weight="600" fill="#31435b">Host boundary</text>
    <text x="64" y="448" font-size="14" fill="#526278">Host supplies reception time, files and networking · Core validates encoded CBOR and applies measurement semantics</text>
    <rect x="42" y="492" width="1036" height="62" rx="12" fill="#fff" stroke="#9aa7b7" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="64" y="517" font-size="15" font-weight="600" fill="#31435b">Planned integration</text>
    <text x="64" y="540" font-size="14" fill="#526278">External SenML semantic checks · MQTT / CoAP transport · Offline inspector · Mooncakes release</text>
  </g>
</svg>
