<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="490" viewBox="0 0 1040 490" role="img" aria-labelledby="title desc">
  <title id="title">SenWeave implementation and planned architecture</title>
  <desc id="desc">The label vocabulary, bounded JSON parser and raw record model are implemented. Full base resolution, CBOR codecs and gateway consumers are planned.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#758397"/></marker></defs>
  <rect width="1040" height="490" rx="20" fill="#f5f8fc"/>
  <g font-family="Segoe UI,Arial,sans-serif">
    <text x="42" y="48" font-size="25" font-weight="700" fill="#102539">SenWeave · SenML data semantics</text>
    <text x="42" y="76" font-size="15" fill="#526278">Solid green = implemented · Dashed outline = planned</text>
    <rect x="42" y="111" width="956" height="76" rx="12" fill="#e0f6ef" stroke="#14775d" stroke-width="2"/>
    <text x="64" y="142" font-size="18" font-weight="600" fill="#145742">Shared label vocabulary · MoonBit</text>
    <text x="64" y="169" font-size="15" fill="#145742">15 RFC 8428 labels · JSON names ↔ integer CBOR keys · exact lookup</text>
    <g fill="#e0f6ef" stroke="#14775d" stroke-width="2">
      <rect x="42" y="227" width="218" height="127" rx="12"/>
      <rect x="345" y="227" width="350" height="127" rx="12"/>
    </g>
    <g fill="#fff" stroke="#9aa7b7" stroke-width="1.5" stroke-dasharray="6 4">
      <rect x="780" y="227" width="218" height="127" rx="12"/>
    </g>
    <g fill="#31435b" font-size="17" font-weight="600"><text x="62" y="258">JSON parser</text><text x="367" y="258">Typed raw records</text><text x="802" y="258">Consumers</text></g>
    <g fill="#526278" font-size="14">
      <text x="62" y="286">Bounded input + types</text><text x="62" y="311">Duplicate-key detection</text><text x="62" y="336">Extension policy</text>
      <text x="367" y="286">Four values + context records</text><text x="367" y="311">Original numbers + binary data</text><text x="367" y="336">Diagnostics · bases remain unresolved</text>
      <text x="802" y="286">Gateway integration</text><text x="802" y="311">Offline inspector</text><text x="802" y="336">Application libraries</text>
    </g>
    <g stroke="#758397" stroke-width="2" marker-end="url(#arrow)"><path d="M262 291h68"/><path d="M697 291h68"/></g>
    <rect x="42" y="390" width="956" height="64" rx="12" fill="#e9eef5"/>
    <text x="64" y="416" font-size="15" font-weight="600" fill="#31435b">Host boundary + next stages</text>
    <text x="64" y="440" font-size="14" fill="#526278">Host owns UTF-8, files and networking · Next: base / time resolution + CBOR codec + gateway integration</text>
  </g>
</svg>
